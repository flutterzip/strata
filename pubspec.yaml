name: strata
description: "Strata — a layered card wallet with physics-driven motion."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  image_picker: ^1.2.3
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Declared as directories (trailing slash) so a buyer can drop a new JSON
  # or image in and it is bundled without editing this file.
  assets:
    - assets/data/
    - assets/images/cards/
    - assets/images/avatars/
    - assets/audio/

  # Bricolage Grotesque (SIL Open Font License 1.1) — bundled rather than
  # fetched at runtime so the template renders identically offline and on
  # first launch. Variable axes: opsz, wdth, wght.
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
